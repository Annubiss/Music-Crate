<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      {
        let theme = "dark"

        try {
          const saved = JSON.parse(localStorage.getItem("create:theme"))

          if (saved === "light" || saved === "dark") {
            theme = saved
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light"
          }
        } catch {}

        document.documentElement.dataset.theme = theme
      }
    </script>

    <title>Crate - Discover and collect music</title>
    <meta name="description"
          content="Search albums and songs, filter by genre and decade, save albums to your collection and build playlists. Powered by MusicBrainz." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
